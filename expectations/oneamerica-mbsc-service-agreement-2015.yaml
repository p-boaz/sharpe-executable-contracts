  - intent: "Notices, governing law, entire-agreement, amendment-by-writing boilerplate (§§16, 19, 20, 23)."
    sourceHeading: "§§16–23"

# --- Real source ambiguities -----------------------------------------
knownConflicts:
  - between:
      - "§13: 'MBSC and the Funds severally agree to pay the Service Provider the fees described in Schedule C (\"Administrative Fees\")'"
      - "Schedule C is not reproduced in the Markdown body"
    resolution: >
      The load-bearing fee schedule is not in the source text as
      provided. An honest IR captures the fee as a variable
      (`administrativeFees`) and flags that the fee-schedule artifact
      is external. Scenario data must supply a dollar value.

  - between:
      - "§14(a) 6-month termination notice"
      - "§14(h) 10-day cure-period-then-terminate"
    resolution: >
      These coexist: (a) is voluntary termination requiring 6 months'
      notice; (h) is breach-triggered termination with only 10 days'
      cure. Not a contradiction, but a well-formed scenario must pick
      which pathway applies per event.

  - between:
      - "§14(d): termination on Distribution Agreement end 'shall not be deemed to apply if, contemporaneously with such termination, a new Distribution Agreement containing substantially similar terms is entered into'"
      - "\"Substantially similar\" is undefined"
    resolution: >
      A standard legal fuzzy qualifier. No IR primitive expresses
      "substantially similar." An honest extractor captures the
      literal clause as unmodeled or as an obligation with a note.

coverageTargets:
  critical:
    - administrative-fees-payment
    - voluntary-termination-six-months
    - material-breach-cure-period
    - service-provider-indemnifies-mbsc
    - mbsc-indemnifies-service-provider
  supporting:
    - fee-dispute-window
    - indemnity-notice-window
    - late-trading-cutoff-cash

# --- Path B shape stress-test findings --------------------------------
formatStressTest:
  - finding: "Externally-referenced schedules lose fidelity in the IR."
    status: documented
    detail: >
      Schedule A (Funds list), Schedule B (Services), Schedule C (Fees)
      are all referenced but not in the Markdown body. Under Path B,
      the IR has no way to encode "see Schedule C." The honest encoding
      is `amount: var("administrativeFees")` — an opaque variable the
      scenario must populate. Not a shape bug; a documentation
      convention.

  - finding: "Indemnification effect now validated on 3 distinct contracts."
    status: confirmed
    detail: >
      Masterworks (asymmetric two-way), Galleria (tenant-to-landlord
      one-way), and OneAmerica (mutual two-way) all fit the
      `indemnification` effect shape cleanly. No strain. This effect
      kind is pulling its weight.

  - finding: "Time-of-day cutoffs strain `TemporalRule`."
    status: minor-shape-fix
    detail: >
      The 4:00 p.m. ET cutoff in §2(b) is a time-of-day, not a
      date or duration. `TemporalRule { type: "on_date", value: string }`
      can hold "4:00 PM ET" as a string, but the semantics are
      ambiguous. For now, the string convention works; if another
      contract needs fine-grained time-of-day logic, consider adding
      `type: "time_of_day"`.

  - finding: "Multi-triggered termination is awkward."
    status: known-gap
    detail: >
      §14 lists 8 distinct termination triggers (a–h), each with
      different notice rules. Under Path B, the cleanest encoding is
      8 separate `default` clauses, one per trigger, each with its
      own `semanticTag: termination_on_<reason>`. That is what the
      expectation file does. It works but makes `default` feel
      granular. An alternative aggregator would be nice but not
      blocking.

  - finding: "`any_party` as an actor value is a convention, not a primitive."
    status: minor-syntax
    detail: >
      §14(a) allows ANY of the three parties to terminate. The
      expectation file encodes this as `actor: "any_party"`, a
      free-string convention. Path B's Party.role is open-string so
      this works. If held-out contracts increase the frequency of
      multi-party triggers, consider a special sentinel or role
      enumeration.

  - finding: "`payment` with opaque amount is honest partial coverage."
    status: confirmed
    detail: >
      The administrative-fee clause's amount is `var("administrativeFees")`
      with no concrete expression — because the source doesn't have
      one. Under Path B, this is clean: the executor can still fire
      the payment clause when the scenario supplies the variable.
      Compare to the broken alternative of fabricating an amount.
