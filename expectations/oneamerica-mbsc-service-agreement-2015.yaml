# Expected IR content for the OneAmerica / MBSC Service Agreement.
# Not a hackathon-spec contract (extra sample); included to broaden
# the expectation set to financial-services administrative contracts.
#
# Written in Path B's new shape.

contractId: oneamerica-mbsc-service-agreement-2015
contractFile: contracts/OneAmerica-MBSC-service-agreement-2015.md
family: service-agreement

expectedParties:
  - role: service_provider
    name: "One America Securities (Indiana)"
  - role: distributor
    name: "MBSC Securities Corporation (New York)"
  - role: funds
    name: "Registered investment companies identified on Schedule A (the Funds)"
    note: >
      "The Funds" is an open list tied to Schedule A (not reproduced
      in the Markdown). The IR treats it as a single collective party;
      individual funds would be enumerated in scenario data.

# --- Modeled expectations --------------------------------------------
expectedClauses:
  - id: administrative-fees-payment
    intent: "MBSC and the Funds severally pay the Service Provider Administrative Fees per Schedule C."
    sourceQuote: "MBSC and the Funds severally agree to pay the Service Provider the fees described in Schedule C (\"Administrative Fees\")"
    mustMatch:
      semanticTag: administrative_fees
      modeled: true
      effect:
        kind: payment
        payer: distributor
        payee: service_provider
        amount:
          op: var
          name: "administrativeFees"
          # Schedule C is external to the Markdown body. The IR stores
          # the variable; scenario data populates it. Honest but lossy.

  - id: fee-dispute-window
    intent: "Service Provider must notify MBSC of any fee-payment dispute within 30 days of receipt."
    sourceQuote: "notice of and the dollar amount of any and all disputes pertaining to any fee payment made under the terms of this Agreement within 30 days of receipt of the fee payment"
    mustMatch:
      semanticTag: fee_dispute_notice
      modeled: true
      effect:
        kind: obligation
        actor: service_provider
        action: "give written notice to MBSC of any fee-payment dispute"
        due:
          type: calendar_days
          value: 30
          anchor: "fee_payment_received"

  - id: voluntary-termination-six-months
    intent: "Any party may terminate new-share sales (and previously sold shares separately) on 6 months' advance written notice."
    sourceQuote: "at the option of the Service Provider, MBSC or a Fund upon six months' advance written notice"
    mustMatch:
      semanticTag: voluntary_termination_notice
      modeled: true
      effect:
        kind: obligation
        actor: any_party
        action: "give written notice of termination"
        due:
          type: months
          value: 6
          anchor: "termination_effective_date"
          direction: before       # <-- depends on TemporalRule direction fix

  - id: material-breach-cure-period
    intent: "Material breach terminates the Agreement unless cured within 10 days to the reasonable satisfaction of the aggrieved party."
    sourceQuote: "is in material breach of this Agreement unless the party in breach cures the breach to the reasonable satisfaction of the party alleging breach within 10 days"
    mustMatch:
      semanticTag: material_breach_termination
      modeled: true
      condition:
        op: eq
        left: "materialBreachDeclared"
        right: true
      effect:
        kind: default
        consequences:
          - "Agreement terminates if breach not cured within 10 days"
          - "Aggrieved party gains right to terminate by written notice"

  - id: indemnity-notice-window
    intent: "Indemnitee must notify indemnitor of an indemnification claim within 7 days of service of first legal process (60 days if indemnitor is also a party)."
    sourceQuote: "notify the indemnitor of the commencement thereof in accordance with the provisions of Section 16 hereof within seven (7) days after the summons or other first legal process shall have been served"
    mustMatch:
      semanticTag: indemnity_notice_obligation
      modeled: true
      effect:
        kind: obligation
        actor: indemnitee
        action: "notify indemnitor of commencement of action"
        due:
          type: calendar_days
          value: 7
          anchor: "summons_served"

  - id: service-provider-indemnifies-mbsc
    intent: "Service Provider indemnifies MBSC, Funds, advisers, administrators, and their personnel against losses arising from Services, negligence/willful misconduct, or material breach."
    sourceQuote: "The Service Provider agrees to indemnify and hold harmless MBSC, the Funds, the Funds' investment advisers, the Funds' administrators, and each of their directors, officers, employees, agents"
    mustMatch:
      semanticTag: service_provider_indemnifies_distributor_and_funds
      modeled: true
      effect:
        kind: indemnification
        indemnifier: service_provider
        indemnitee: "MBSC, Funds, their investment advisers, administrators, and their personnel"
        scope: "losses, claims, damages, liabilities, or expenses arising from (i) provision of Administrative Services, (ii) negligence or willful misconduct, (iii) material breach of Agreement, or (iv) breach of a representation/warranty/covenant"
        carveOuts: []

  - id: mbsc-indemnifies-service-provider
    intent: "MBSC indemnifies the Service Provider against losses arising from MBSC's material breach of Agreement or of reps/warranties/covenants."
    sourceQuote: "MBSC agrees to indemnify and hold harmless the Service Provider"
    mustMatch:
      semanticTag: distributor_indemnifies_service_provider
      modeled: true
      effect:
        kind: indemnification
        indemnifier: distributor
        indemnitee: service_provider
        scope: "losses, claims, damages, liabilities, or expenses arising from MBSC's material breach of Agreement or of a representation/warranty/covenant"
        carveOuts: []

  - id: late-trading-cutoff-cash
    intent: "Instructions received before NYSE close (currently 4:00 p.m. ET) on a Business Day are executed at that day's NAV; otherwise next Business Day's NAV."
    sourceQuote: "to be treated as received prior to the close of trading on such Business Day (currently 4:00p.m. Eastern Time)"
    mustMatch:
      semanticTag: late_trading_cutoff
      modeled: true
      effect:
        kind: obligation
        actor: service_provider
        action: "treat instructions received by 4:00 p.m. ET as same-Business-Day orders; later orders as next Business Day"
        due:
          type: on_date
          value: "4:00 PM ET"
    note: >
      Time-of-day cutoffs are a new temporal kind this contract
      introduces. Path B's `TemporalRule` supports "on_date" as a
      string anchor; "4:00 PM ET" is a string. Works by convention
      but the semantics are looser than the calendar_days / months
      cases. Flag as shape finding.

