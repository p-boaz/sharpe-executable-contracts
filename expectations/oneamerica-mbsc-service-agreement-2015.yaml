    sourceHeading: "§14(b)"
    note: "Regulatory-trigger termination. Conditional but not expressible without a regulation-feed primitive."

  - intent: "Termination on FINRA/SEC formal proceedings against any party."
    sourceHeading: "§14(c)"

  - intent: "Termination on MBSC Distribution Agreement termination (with substantially-similar-replacement carve-out)."
    sourceHeading: "§14(d)"

  - intent: "Termination on Dreyfus Investment Advisory/Administration Agreement termination (with similar carve-out)."
    sourceHeading: "§14(e)"

  - intent: "Suspension of new sales on Fund's market/economic/political judgment, SEC stop orders, or missing registration prospectus."
    sourceHeading: "§14(f)"

